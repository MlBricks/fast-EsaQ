[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastEsa"
version = "0.3.8"
description = "MLBricks fastEsa with CUDA accelerated half-life Quality ESA and SWQR scan"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [{name = "Zameer Hussain"}, {name = "Akhtar Hussain"}]
keywords = ["ESA", "MLBricks", "fastEsa", "recurrent state", "PyTorch"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only",
 "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[tool.setuptools.packages.find]
include = ["fastesa", "fastesa.*"]

[tool.setuptools.package-data]
"fastesa" = ["_cuda/*.cu", "_cuda/*.cpp"]
